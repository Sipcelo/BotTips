services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: valuebot
      POSTGRES_USER: valuebot
      POSTGRES_PASSWORD: valuebot_senha
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuebot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
